; PlatformIO build for the Flipper Cloud ESP32 firmware.
; Default target is the official Flipper Zero WiFi Dev Board (ESP32-S2).
;   pio run -e wifi_devboard -t upload

[platformio]
src_dir = FlipperCloudESP32
default_envs = wifi_devboard

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7
build_flags = -DCORE_DEBUG_LEVEL=0

; Flipper Zero WiFi Dev Board (ESP32-S2), UART0 on GPIO43/44 wired to Flipper pins 13/14
[env:wifi_devboard]
board = esp32-s2-saola-1

; Generic ESP32 (WROOM/DevKit) wired to the Flipper: RX=GPIO16, TX=GPIO17
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DFLIPPER_RX_PIN=16 -DFLIPPER_TX_PIN=17

; ESP32-S3 DevKit: RX=GPIO44, TX=GPIO43
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DFLIPPER_RX_PIN=44 -DFLIPPER_TX_PIN=43

; ESP32-C3 DevKit: RX=GPIO20, TX=GPIO21
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DFLIPPER_RX_PIN=20 -DFLIPPER_TX_PIN=21
